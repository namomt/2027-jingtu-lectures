<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2027年 淨土講座行事曆</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 全局背景：跟隨滑動呈現淡雅花箋紙色 */
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--theme-bg, #f4eee6);
      color: #382e27;
      min-height: 100vh;
      padding: 40px 16px 60px;
      transition: background 0.6s cubic-bezier(0.2, 0, 0, 1);
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
    }

    /* 整個網頁大背景：鋪設宋錦青海波與回紋織錦暗紋 */
    .global-bg-texture {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      opacity: 0.36;
      mix-blend-mode: multiply;
    }

    .container {
      max-width: 1340px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* 頂部標題 */
    header {
      text-align: center;
      margin-bottom: 26px;
    }
    header h1 {
      font-family: 'Noto Serif TC', serif;
      font-size: clamp(2rem, 3.4vw, 2.75rem);
      letter-spacing: 5px;
      color: var(--title-text, #3a2b20);
      font-weight: 900;
      text-shadow: 0 1px 3px rgba(255, 255, 255, 0.85);
      margin-bottom: 10px;
    }

    /* 動態月份時令標題 */
    .active-month-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Serif TC', serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--title-text, #3a2b20);
      transition: color 0.4s ease;
    }

    .calendar-status {
      margin-top: 10px;
      color: var(--title-text, #3a2b20);
      font-size: 0.95rem;
      line-height: 1.55;
      font-weight: 700;
    }

    /* 滑動外層舞台 */
    .stage-wrapper {
      width: 100%;
      max-width: 1260px;
      position: relative;
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 左右導航按鈕 */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      color: #4a3a2d;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s ease;
      user-select: none;
    }
    .nav-arrow:hover {
      background: #ffffff;
      transform: translateY(-50%) scale(1.08);
    }
    .nav-prev { left: -16px; }
    .nav-next { right: -16px; }

    /* 滑動視窗 */
    .scroll-stage {
      width: 100%;
      overflow-x: auto;
      padding: 24px 0 32px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 16px 40px rgba(70, 50, 30, 0.06);
      cursor: grab;
      cursor: -webkit-grab;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .scroll-stage::-webkit-scrollbar {
      display: none;
    }
    .scroll-stage.is-dragging {
      cursor: grabbing;
      cursor: -webkit-grabbing;
      scroll-behavior: auto !important;
    }

    /* 軌道內容 */
    .spectrum-track {
      display: inline-flex;
      gap: 0;
      padding: 0 40px;
      pointer-events: none;
    }

    /* 核心花箋宣紙色譜柱 */
    .color-column {
      flex: 0 0 156px;
      height: 556px;
      height: clamp(420px, 64svh, 556px);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 34px 12px 22px;
      scroll-snap-align: center;
      background-color: var(--col-base);
      background-image: 
        radial-gradient(circle at 50% 25%, rgba(255,255,255,0.45) 0%, transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.06) 100%);
      border-right: 1px solid rgba(255, 255, 255, 0.45);
      overflow: hidden;
      transition: filter 0.25s ease;
      pointer-events: auto;
    }
    .color-column:first-child {
      border-top-left-radius: 18px;
      border-bottom-left-radius: 18px;
    }
    .color-column:last-child {
      border-right: none;
      border-top-right-radius: 18px;
      border-bottom-right-radius: 18px;
    }
    .color-column:hover {
      filter: brightness(1.03);
    }
    .color-column[aria-current="true"]::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 2;
      border: 2px solid currentColor;
      color: var(--name-color);
      border-radius: inherit;
      pointer-events: none;
    }

    /* 宣紙微細絲絮疊加層 */
    .paper-fiber-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.35;
      mix-blend-mode: multiply;
    }

    .column-content {
      position: relative;
      z-index: 2;
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    /* 1. 日期區域 */
    .col-top-box {
      width: 100%;
      height: 168px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .col-date-text {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      font-family: 'Noto Serif TC', serif;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--font-color, #4a3428);
      opacity: 0.92;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.65);
    }
    .col-date-text span {
      display: block;
      line-height: 1;
    }
    .col-date-text.is-outreach {
      color: #9c2828;
      font-weight: 700;
      opacity: 1;
    }

    /* 2. 姓名區域 */
    .col-middle-name {
      font-family: 'Noto Serif TC', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 6px 0;
    }
    .col-middle-name span {
      display: block;
      font-size: 1.9rem;
      font-weight: 700;
      line-height: 1;
      color: var(--name-color, #33231a);
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.75);
    }

    /* 3. 底部淨土宗官方宗徽 */
    .col-bottom-stamp {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 64px;
      width: 100%;
      flex-shrink: 0;
    }
    .plb-emblem-img {
      width: 58px;
      height: auto;
      max-height: 58px;
      object-fit: contain;
      display: block;
      opacity: 0.94;
      filter: drop-shadow(0 1px 1px rgba(255, 255, 255, 0.5));
    }

    /* 頁尾固定文字 */
    footer {
      text-align: center;
      margin-top: 52px;
      padding-top: 24px;
      border-top: 1px solid rgba(130, 105, 80, 0.25);
      font-size: 0.95rem;
      color: #4a3a2d;
      letter-spacing: 2px;
      font-weight: 600;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 600px) {
      body { padding: 18px clamp(8px, 3vw, 16px) 28px; }
      header { margin-bottom: 12px; }
      header h1 { font-size: clamp(1.3rem, 5.5vw, 2rem); letter-spacing: 0.08em; }
      .active-month-bar { font-size: clamp(0.9rem, 4vw, 1.13rem); letter-spacing: 0.08em; }
      .calendar-status { margin-top: 7px; font-size: 0.875rem; }
      .stage-wrapper { margin-top: 6px; }
      .scroll-stage { padding-block: 12px 16px; border-radius: 18px; }
      .spectrum-track { padding-inline: clamp(10px, 4vw, 22px); }
      .color-column {
        flex-basis: clamp(104px, 37vw, 156px);
        height: 410px;
        height: clamp(280px, 63svh, 480px);
        padding: 18px 8px 12px;
      }
      .col-top-box { height: min(37%, 143px); }
      .col-middle-name { gap: clamp(5px, 2vw, 11px); }
      .col-middle-name span { font-size: clamp(1.25rem, 6.2vw, 1.65rem); }
      .col-bottom-stamp { height: 44px; }
      .plb-emblem-img { width: 42px; max-height: 42px; }
      .nav-arrow { display: none; }
      footer { margin-top: 24px; padding-top: 12px; font-size: 0.8rem; letter-spacing: 0.5px; line-height: 1.6; }
    }
    @media (prefers-reduced-motion: reduce) {
      body, .active-month-bar { transition: none; }
    }
  </style>
</head>

const calendarYear = 2027;
const taipeiDateFormatter = new Intl.DateTimeFormat('en-CA', {
  timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit'
});

function taipeiDateKey(now = new Date()) {
  const parts = Object.fromEntries(taipeiDateFormatter.formatToParts(now).map(({ type, value }) => [type, value]));
  return `${parts.year}-${parts.month}-${parts.day}`;
}

function readLectureDate(item) {
  if (item.isOutreach) return null;
  const match = item.dateChars.join('').match(/^(.+?)月(.+?)日/);
  if (!match) return null;
  const digit = ch => '〇一二三四五六七八九'.indexOf(ch);
  const number = text => {
    if (/^[〇一二三四五六七八九]{1,2}$/.test(text)) {
      return [...text].reduce((value, ch) => value * 10 + digit(ch), 0);
    }
    const parts = text.match(/^([一二三])?([十廿])([〇一二三四五六七八九])?$/);
    if (!parts || (parts[2] === '廿' && parts[1])) return NaN;
    return (parts[2] === '廿' ? 20 : (parts[1] ? digit(parts[1]) : 1) * 10) + (parts[3] ? digit(parts[3]) : 0);
  };
  const month = number(match[1]);
  const day = number(match[2]);
  const actual = new Date(Date.UTC(calendarYear, month - 1, day));
  if (actual.getUTCMonth() + 1 !== month || actual.getUTCDate() !== day) return null;
  const pad = n => String(n).padStart(2, '0');
  return { month, day, key: `${calendarYear}-${pad(month)}-${pad(day)}` };
}

function selectOpeningLecture(today) {
  const dated = allEvents.flatMap((item, index) => {
    const date = readLectureDate(item);
    return date ? [{ item, index, ...date }] : [];
  }).sort((a, b) => a.key.localeCompare(b.key) || a.index - b.index);
  const upcoming = dated.find(event => event.key >= today);
  return { upcoming, display: upcoming ?? dated.at(-1) };
}

function showMonth(item) {
  document.body.style.setProperty('--theme-bg', item.bgTheme);
  document.body.style.setProperty('--title-text', item.titleColor);
  document.getElementById('activeMonthHeader').textContent = item.monthHeader;
}

function openAtUpcomingLecture(now = new Date()) {
  const today = taipeiDateKey(now);
  const { upcoming, display } = selectOpeningLecture(today);
  if (!display) return;
  const stage = document.getElementById('scrollStage');
  const column = document.getElementById(`col-${display.index}`);
  const status = document.getElementById('calendarStatus');
  if (upcoming) {
    column.setAttribute('aria-current', 'true');
    status.textContent = `${upcoming.key === today ? '今天的講座' : '下一場講座'}：${upcoming.month} 月 ${upcoming.day} 日 · ${upcoming.item.name}`;
  } else {
    status.textContent = '2027 年有日期的講座都已結束。';
  }
  status.hidden = false;
  const stageRect = stage.getBoundingClientRect();
  const rect = column.getBoundingClientRect();
  stage.scrollLeft += (rect.left + rect.width / 2) - (stageRect.left + stageRect.width / 2);
  showMonth(display.item);
}

// 宣紙絲絮質感層
function getPaperFiberSvg() {
  return `
    <svg class="paper-fiber-overlay" viewBox="0 0 100 400" preserveAspectRatio="none">
      <rect width="100%" height="100%" fill="#ffffff" filter="url(#paperFiber)" opacity="0.55"/>
    </svg>
  `;
}

function renderColumns() {
  const track = document.getElementById('spectrumTrack');
  let html = '';

  allEvents.forEach((item, idx) => {
    const dateCharsHtml = item.dateChars.map(ch => `<span>${ch}</span>`).join('');
    const outreachClass = item.isOutreach ? 'col-date-text is-outreach' : 'col-date-text';
    const nameCharsHtml = item.name.split('').map(ch => `<span>${ch}</span>`).join('');

    html += `
      <div class="color-column" id="col-${idx}" style="--col-base: ${item.base}; --font-color: ${item.fontColor}; --name-color: ${item.nameColor};">
        ${getPaperFiberSvg()}
        <div class="column-content">
          <div class="col-top-box">
            <div class="${outreachClass}">
              ${dateCharsHtml}
            </div>
          </div>

          <div class="col-middle-name">
            ${nameCharsHtml}
          </div>

          <div class="col-bottom-stamp">
            <img class="plb-emblem-img" src="https://plb.tw/tc/images/logo.svg" alt="淨土宗宗徽" draggable="false" />
          </div>
        </div>
      </div>
    `;
  });

  track.innerHTML = html;
}

function smoothScroll(offset) {
  const stage = document.getElementById('scrollStage');
  if (stage) {
    stage.scrollBy({ left: offset, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
  }
}

function setupDragAndScroll() {
  const stage = document.getElementById('scrollStage');
  let previousScroll = stage.scrollLeft;

  let isDown = false;
  let startX;
  let scrollLeft;
  let velocity = 0;
  let lastX = 0;
  let lastTime = 0;
  let momentumId = null;

  stage.addEventListener('mousedown', (e) => {
    isDown = true;
    stage.classList.add('is-dragging');
    startX = e.pageX - stage.offsetLeft;
    scrollLeft = stage.scrollLeft;
    lastX = e.pageX;
    lastTime = performance.now();
    cancelAnimationFrame(momentumId);
  });

  window.addEventListener('mouseup', () => {
    if (!isDown) return;
    isDown = false;
    stage.classList.remove('is-dragging');
    applyInertia();
  });

  stage.addEventListener('mouseleave', () => {
    if (!isDown) return;
    isDown = false;
    stage.classList.remove('is-dragging');
    applyInertia();
  });

  stage.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - stage.offsetLeft;
    const walk = (x - startX) * 1.35;
    stage.scrollLeft = scrollLeft - walk;

    const now = performance.now();
    const dt = now - lastTime;
    if (dt > 10) {
      velocity = (e.pageX - lastX) / dt;
      lastX = e.pageX;
      lastTime = now;
    }
  });

  function applyInertia() {
    if (Math.abs(velocity) < 0.1) return;
    stage.scrollLeft -= velocity * 16;
    velocity *= 0.94;
    momentumId = requestAnimationFrame(applyInertia);
  }

  let rafPending = false;
  stage.addEventListener('scroll', () => {
    if (!rafPending) {
      requestAnimationFrame(() => {
        rafPending = false;
        if (stage.scrollLeft === previousScroll) return;
        previousScroll = stage.scrollLeft;
        const stageRect = stage.getBoundingClientRect();
        const centerX = stageRect.left + stageRect.width / 2;

        let closestIdx = 0;
        let minDiff = Infinity;

        const columns = document.querySelectorAll('.color-column');
        columns.forEach((col, idx) => {
          const rect = col.getBoundingClientRect();
          const colCenter = rect.left + rect.width / 2;
          const diff = Math.abs(centerX - colCenter);
          if (diff < minDiff) {
            minDiff = diff;
            closestIdx = idx;
          }
        });

        const activeItem = allEvents[closestIdx];
        if (activeItem) showMonth(activeItem);
      });
      rafPending = true;
    }
  }, { passive: true });
}

renderColumns();
openAtUpcomingLecture();
setupDragAndScroll();
